<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Avatar</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#101024;font-family:system-ui,sans-serif}
  canvas{display:block;width:100%;height:100%}
  #start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000c;z-index:5}
  #start button{font-size:22px;padding:16px 28px;border:0;border-radius:14px;background:#ffb400;font-weight:700}
  #bubble{position:fixed;left:5%;right:5%;bottom:8%;padding:12px 16px;border-radius:16px;background:#fffe;
    color:#111;font-size:20px;text-align:center;display:none;z-index:2}
</style>
</head>
<body>
<div id="start"><button id="go">Iniciar avatar</button></div>
<div id="bubble"></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
  "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.0.0/lib/three-vrm.module.min.js"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1b1b3a);
scene.fog = new THREE.Fog(0x1b1b3a, 6, 16);

const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 50);
camera.position.set(0, 1.3, 4);
camera.lookAt(0, 1.1, 0);

scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.position.set(2, 4, 3);
scene.add(sun);

const floor = new THREE.Mesh(new THREE.CircleGeometry(6, 48),
  new THREE.MeshStandardMaterial({ color: 0x2c2c5a }));
floor.rotation.x = -Math.PI / 2;
scene.add(floor);

const starGeo = new THREE.BufferGeometry();
const pts = [];
for (let i = 0; i < 300; i++) pts.push((Math.random() - .5) * 20, Math.random() * 8 + .5, -Math.random() * 10 - 2);
starGeo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.05 })));

let vrm = null, fallback = null;
let speaking = false, happyUntil = 0, bounceUntil = 0;

function buildFallback() {
  const g = new THREE.Group();
  const skin = new THREE.MeshStandardMaterial({ color: 0xffd2a8 });
  const cloth = new THREE.MeshStandardMaterial({ color: 0xff8a00 });
  const hairM = new THREE.MeshStandardMaterial({ color: 0x111111 });
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.28, 0.6, 6, 16), cloth);
  body.position.y = 0.75;
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.28, 24, 24), skin);
  head.position.y = 1.5;
  for (let i = 0; i < 7; i++) {
    const c = new THREE.Mesh(new THREE.ConeGeometry(0.09, 0.4, 8), hairM);
    const a = (i / 6) * Math.PI - Math.PI / 2;
    c.position.set(Math.sin(a) * 0.2, 1.82 + Math.cos(a) * 0.05, 0);
    c.rotation.z = -Math.sin(a) * 0.8;
    g.add(c);
  }
  const eyeM = new THREE.MeshBasicMaterial({ color: 0x000000 });
  [-0.1, 0.1].forEach(x => {
    const e = new THREE.Mesh(new THREE.SphereGeometry(0.03, 8, 8), eyeM);
    e.position.set(x, 1.55, 0.25); g.add(e);
  });
  const mouth = new THREE.Mesh(new THREE.SphereGeometry(0.05, 12, 12), new THREE.MeshBasicMaterial({ color: 0x990000 }));
  mouth.position.set(0, 1.43, 0.26); mouth.scale.set(1, 0.3, 0.5);
  mouth.name = 'mouth';
  g.add(body, head, mouth);
  scene.add(g);
  fallback = g;
}

new GLTFLoader().register(p => new VRMLoaderPlugin(p))
  .load('/model.vrm', gltf => {
    vrm = gltf.userData.vrm;
    VRMUtils.rotateVRM0(vrm);
    const h = vrm.humanoid;
    h.getNormalizedBoneNode('leftUpperArm').rotation.z = 1.2;
    h.getNormalizedBoneNode('rightUpperArm').rotation.z = -1.2;
    scene.add(vrm.scene);
  }, undefined, () => buildFallback());

let voice = null;
function pickVoice() {
  const vs = speechSynthesis.getVoices();
  voice = vs.find(v => v.lang === 'pt-BR') || vs.find(v => v.lang.startsWith('pt')) || null;
}
speechSynthesis.onvoiceschanged = pickVoice; pickVoice();

const queue = [];
let busy = false;
const bubble = document.getElementById('bubble');

function say(text, mood) {
  if (queue.length > 6) return;
  queue.push({ text, mood });
  next();
}
function next() {
  if (busy || !queue.length) return;
  busy = true;
  const { text, mood } = queue.shift();
  bubble.textContent = text; bubble.style.display = 'block';
  const u = new SpeechSynthesisUtterance(text);
  if (voice) u.voice = voice;
  u.lang = 'pt-BR'; u.pitch = 1.2; u.rate = 1.05;
  u.onstart = () => { speaking = true; };
  const done = () => {
    speaking = false; busy = false;
    setTimeout(() => { if (!busy) bubble.style.display = 'none'; }, 800);
    next();
  };
  u.onend = done; u.onerror = done;
  if (mood === 'happy') { happyUntil = performance.now() + 4000; bounceUntil = performance.now() + 2500; }
  speechSynthesis.speak(u);
}

const pick = a => a[Math.floor(Math.random() * a.length)];
const lastJoin = {};

function handle(ev) {
  if (ev.type === 'gift') {
    const q = ev.count > 1 ? ev.count + ' vezes ' : '';
    say(pick([
      `Uau! Obrigado, ${ev.user}, pelo presente ${ev.gift}!`,
      `${ev.user}, você é demais! ${q}${ev.gift}, valeu!`,
      `Que isso, ${ev.user}! Muito obrigado pelo ${ev.gift}!`
    ]), 'happy');
  } else if (ev.type === 'follow') {
    say(`${ev.user}, seja bem-vindo à família! Obrigado por seguir!`, 'happy');
  } else if (ev.type === 'join') {
    const t = Date.now();
    if (lastJoin[ev.user] && t - lastJoin[ev.user] < 600000) return;
    lastJoin[ev.user] = t;
    if (Math.random() < 0.4) say(`Opa, ${ev.user} chegou! Fica aí com a gente!`);
  } else if (ev.type === 'chat') {
    const t = ev.text.toLowerCase();
    if (/^(oi|olá|ola|eae|e aí|opa)\b/.test(t)) say(`Oi, ${ev.user}! Tudo bem?`);
    else if (t.includes('?') && Math.random() < 0.5) say(`${ev.user}, boa pergunta! Já já eu respondo.`);
  }
}

function connectWS() {
  const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
  ws.onmessage = e => handle(JSON.parse(e.data));
  ws.onclose = () => setTimeout(connectWS, 3000);
}

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta(), t = clock.elapsedTime, now = performance.now();
  const bounce = now < bounceUntil ? Math.abs(Math.sin(t * 8)) * 0.12 : 0;
  const mouthOpen = speaking ? (Math.sin(t * 18) * 0.5 + 0.5) : 0;

  if (vrm) {
    vrm.scene.position.y = bounce;
    vrm.scene.rotation.y = Math.sin(t * 0.6) * 0.1;
    const em = vrm.expressionManager;
    em.setValue('aa', mouthOpen * 0.7);
    em.setValue('happy', now < happyUntil ? 1 : 0);
    em.setValue('blink', (t % 4) < 0.15 ? 1 : 0);
    vrm.update(dt);
  }
  if (fallback) {
    fallback.position.y = bounce + Math.sin(t * 2) * 0.01;
    fallback.rotation.y = Math.sin(t * 0.6) * 0.15;
    const m = fallback.getObjectByName('mouth');
    m.scale.y = 0.3 + mouthOpen * 1.2;
  }
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
});

document.getElementById('go').onclick = () => {
  document.getElementById('start').remove();
  speechSynthesis.speak(new SpeechSynthesisUtterance(''));
  connectWS();
  say('Oi pessoal! A live vai começar!', 'happy');
};
</script>
</body>
</html>
